[project]
name = "dloct"
version = "0.1.0"
description = "Deep learning reconstruction of laterally undersampled complex OCT tomograms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "tqdm>=4.66.0",
    "torch>=2.6.0",
    "einops>=0.8.0",
    "scikit-image>=0.24.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyter>=1.1.1",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# CUDA 12.8 wheels: runs on H100/A100 and consumer GPUs with driver >= 570.
# The PyPI default (cu130) needs driver >= 580, which many clusters don't have yet.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
