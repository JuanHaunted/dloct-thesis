[project]
name = "dloct"
version = "0.1.0"
description = "Deep learning reconstruction of laterally undersampled complex OCT tomograms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "tqdm>=4.66.0",
    "torch>=2.6.0",
    "einops>=0.8.0",
    "scikit-image>=0.24.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyter>=1.1.1",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# CUDA 12.6 wheels: the newest build that still ships Volta (sm_70) kernels for the V100s on
# Apolo accel-2, and it also runs on Turing through Hopper. Needs NVIDIA driver >= 525.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
